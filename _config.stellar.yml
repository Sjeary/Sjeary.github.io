logo:
  avatar: '[/assets/avatar.svg](/about/)'
  title: '[Sjeary](/)'
  subtitle: 个人主页与博客

menubar:
  items:
    - id: home
      title: 主页
      icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg>'
      url: /
      theme: '#2375d8'
    - id: about
      title: 关于我
      icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>'
      url: /about/
      theme: '#2375d8'
    - id: post
      title: 博客
      icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M12 8h5M12 12h5M3 8h4M3 16h4"/></svg>'
      url: /blog/
      theme: '#2375d8'

site_tree:
  home:
    leftbar: sjeary
    rightbar: null
  index_blog:
    base_dir: blog
    menu_id: post
    leftbar: sjeary
    rightbar: null
  page:
    leftbar: sjeary
    rightbar: null
  post:
    leftbar: sjeary
    rightbar: toc

search:
  service: null
comments:
  service: null
article:
  license: ''
  share: []
  card_style: classic
footer:
  content: |
    © 2026 Sjeary · 由 [Hexo](https://hexo.io/) 与 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 驱动。
plugins:
  preload:
    enable: false
  scrollreveal:
    enable: false
  swiper:
    enable: false
style:
  prefers_theme: auto
  color:
    theme: '#2375d8'
    accent: '#2375d8'
    link: '#2375d8'
  leftbar:
    background-image: none
  prefix:
    h2: ''
  font-family:
    body: 'system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif'
  font-size:
    root: 16px
    codeblock: 0.875rem
  gradient:
    avatar: 'conic-gradient(from 0deg, #2375d8, #60b0ed, #2375d8)'
default:
  avatar: /assets/avatar.svg
