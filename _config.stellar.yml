logo:
  avatar: '[/assets/avatar.svg](/about/)'
  title: '[Sjeary](/)'
  subtitle: 个人主页与博客

menubar:
  items:
    - id: home
      title: 主页
      icon: example:planet
      url: /
      theme: '#1BCDFC'
    - id: about
      title: 关于我
      icon: default:shield-user
      url: /about/
      theme: '#3DC550'
    - id: post
      title: 博客
      icon: default:documents
      url: /blog/
      theme: '#FA6400'

site_tree:
  home:
    leftbar: sjeary, recent
    rightbar: toc
  index_blog:
    base_dir: blog
    menu_id: post
    leftbar: sjeary, recent
    rightbar: null
  page:
    leftbar: sjeary, recent
    rightbar: toc
  post:
    leftbar: recent
    rightbar: toc

search:
  service: local_search
comments:
  service: null
article:
  license: ''
  share: []
footer:
  content: |
    © 2026 Sjeary · 由 [Hexo](https://hexo.io/) 与 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 驱动。
plugins:
  preload:
    enable: false
  scrollreveal:
    enable: false
  swiper:
    enable: false
style:
  prefers_theme: auto
  font-size:
    root: 16px
    codeblock: 0.875rem
default:
  avatar: /assets/avatar.svg
